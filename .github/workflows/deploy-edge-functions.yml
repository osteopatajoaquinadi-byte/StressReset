name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy hotmart-webhook (no JWT)
        run: supabase functions deploy hotmart-webhook --project-ref $PROJECT_ID --no-verify-jwt

      - name: Deploy claim-purchase (requires JWT)
        run: supabase functions deploy claim-purchase --project-ref $PROJECT_ID

      - name: Set HOTMART_WEBHOOK_TOKEN secret
        run: supabase secrets set HOTMART_WEBHOOK_TOKEN="${{ secrets.HOTMART_WEBHOOK_TOKEN }}" --project-ref $PROJECT_ID
